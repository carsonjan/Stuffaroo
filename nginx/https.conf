server {
    listen 80;
    server_name stuffaroo.shop;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name stuffaroo.shop;

    ssl_certificate /etc/letsencrypt/live/stuffaroo.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stuffaroo.shop/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/stuffaroo/routes.conf;
}
