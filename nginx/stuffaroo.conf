server {
    listen 80;
    listen [::]:80;
    server_name stuffaroo.shop;

    location = /marketplace {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }

    location ^~ /marketplace/ {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }

    location ^~ /_next/ {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }

    location ^~ /auth/ {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
    }
}
