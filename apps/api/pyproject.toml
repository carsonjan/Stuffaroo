[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.2",
    "google-genai>=1.0",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.10",
]

[dependency-groups]
dev = [
    "cryptography>=43",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
