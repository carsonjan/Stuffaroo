name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Skip installing git hooks on the runner.
      LEFTHOOK: "0"
      # API tests run against the service database below and must not skip.
      REQUIRE_TEST_DB: "1"
      TEST_ADMIN_DATABASE_URL: postgresql://postgres:stuffaroo@localhost:5433/postgres
    services:
      # Same image family as Tiger Cloud: Postgres + pgvector + pgvectorscale.
      postgres:
        image: timescale/timescaledb-ha:pg17
        env:
          POSTGRES_PASSWORD: stuffaroo
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: uv sync --locked --directory apps/api

      - name: Lint, typecheck and test
        run: pnpm check

      - name: Build web
        run: pnpm --dir apps/web build
